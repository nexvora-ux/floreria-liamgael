<body>
  <main class="app" aria-label="Florería Liam Gael">
    <div class="stage" id="stage">
      <img class="artwork" src="assets/interfaz-referencia.webp" alt="" aria-hidden="true">
      <div class="delivery-label" aria-label="Delivery a todo Lima">🚚 ¡DELIVERY A TODO LIMA!</div>
      <section class="categories" aria-label="Categorías de flores">
        <div class="category-track" id="categoryTrack" tabindex="0">
          <a class="category" href="https://www.floreriasenlimaliamgael.com/categoria-producto/ramos-coreanos/" target="_blank" rel="noopener noreferrer"><img src="assets/ramos-coreanos.jpg" alt="Ramo de flores estilo coreano"><span>Ramos Coreanos</span></a>
          <a class="category" href="https://www.floreriasenlimaliamgael.com/categoria-producto/decoracion-de-carro/" target="_blank" rel="noopener noreferrer"><img src="assets/decoracion-carro.jpg" alt="Automóvil con decoración floral"><span>Decoración de carro</span></a>

      <button class="carousel-next" id="next" type="button" aria-label="Ver más categorías"></button>

        <a class="hotspot catalog" aria-label="Ver catálogo" href="https://www.floreriasenlimaliamgael.com/productos/" target="_blank" rel="noopener noreferrer"></a>
        <a class="hotspot orders" aria-label="Hacer un pedido por WhatsApp" href="https://wa.me/51923474329?text=Hola%2C%20quiero%20hacer%20un%20pedido%20con%20delivery%20en%20Lima" target="_blank" rel="noopener noreferrer"></a>
        <a class="hotspot call" aria-label="Llamar al 923 474 329" href="tel:+51923474329"></a>
        <a class="hotspot location" aria-label="Ver ubicación en Google Maps" href="https://www.google.com/maps?q=-11.9380864,-77.0679149" target="_blank" rel="noopener noreferrer"></a>
        <button class="hotspot hours" type="button" id="hours" aria-label="Ver horario de atención"></button>
        <a class="hotspot instagram" aria-label="Instagram de Florería Liam Gael" href="https://www.instagram.com/floreria_liam_gael/" target="_blank" rel="noopener noreferrer"></a>

        <a class="hotspot primary-order" aria-label="Haz tu pedido por WhatsApp" href="https://wa.me/51923474329?text=Hola%2C%20quiero%20hacer%20un%20pedido%20con%20delivery%20en%20Lima" target="_blank" rel="noopener noreferrer"></a>
        <button class="hotspot save" type="button" id="install" aria-label="Guardar e instalar esta aplicación"></button>
        <button class="hotspot share" type="button" id="share" aria-label="Compartir la aplicación"></button>
      </div>
    </div>
    <p class="feedback" id="feedback" aria-live="polite" role="status"></p>
  </main>
  <dialog id="hoursDialog" class="dialog">
    <form method="dialog">
      <div class="dialog-icon">🕒</div>
      <h2>Atención las 24 horas</h2>
      <p>Atendemos <b>todos los días del año</b>, incluidos domingos y feriados.</p>
      <p class="dialog-delivery">🚚 ¡DELIVERY A TODO LIMA!</p>
      <button type="submit">Entendido</button>
    </form>
  </dialog>
  <script src="app.js" defer></script>
